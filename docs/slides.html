d="slide-2" aria-label="Slide 2: An easy front door. A deeper AI workspace."><svg viewBox="0 0 1280 720" role="img" aria-labelledby="title-2"><title id="title-2">An easy front door. A deeper AI workspace.</title><rect x="0" y="0" width="1280" height="720" rx="0" fill="#F5F4EE" stroke="none"/><text x="60" y="46.66" fill="#626D5F" font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="700">01 / TWO CONNECTED INTERFACES</text><text x="60" y="109.44" fill="#1A3029" font-family="Segoe UI, Arial, sans-serif" font-size="42" font-weight="700">An easy front door. A deeper AI workspace.</text><rect x="60" y="184" width="559" height="324" rx="8" fill="#173C32" stroke="none"/><text x="86" y="218.66" fill="#E2EBA6" font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="700">01 / FIND A SPACE</text><text x="86" y="269.96" fill="#FFFEFA" font-family="Segoe UI, Arial, sans-serif" font-size="28" font-weight="700">One request. One clear result.</text><line x1="116" y1="337" x2="210" y2="337" stroke="#6C8766" stroke-width="2"/><circle cx="99" cy="337" r="17" fill="#E2EBA6" stroke="none"/><text x="95" y="342.12" fill="#173C32" font-family="Segoe UI, Arial, sans-serif" font-size="16" font-weight="700">1</text><text x="82" y="385.76" fill="#FFFEFA" font-family="Segoe UI, Arial, sans-serif" font-size="18" font-weight="700">Search</text><line x1="244" y1="337" x2="338" y2="337" stroke="#6C8766" stroke-width="2"/><circle cx="227" cy="337" r="17" fill="#E2EBA6" stroke="none"/><text x="223" y="342.12" fill="#173C32" font-family="Segoe UI, Arial, sans-serif" font-size="16" font-weight="700">2</text><text x="210" y="385.76" fill="#FFFEFA" font-family="Segoe UI, Arial, sans-serif" font-size="18" font-weight="700">Result</text><line x1="372" y1="337" x2="466" y2="337" stroke="#6C8766" stroke-width="2"/><circle cx="355" cy="337" r="17" fill="#E2EBA6" stroke="none"/><text x="351" y="342.12" fill="#173C32" font-family="Segoe UI, Arial, sans-serif" font-size="16" font-weight="700">3</text><text x="338" y="385.76" fill="#FFFEFA" font-family="Segoe UI, Arial, sans-serif" font-size="18" font-weight="700">Review</text><circle cx="483" cy="337" r="17" fill="#E2EBA6" stroke="none"/><text x="479" y="342.12" fill="#173C32" font-family="Segoe UI, Arial, sans-serif" font-size="16" font-weight="700">4</text><text x="466" y="385.76" fill="#FFFEFA" font-family="Segoe UI, Arial, sans-serif" font-size="18" font-weight="700">Confirm</text><text x="86" y="444.58" fill="#D1DCC4" font-family="Segoe UI, Arial, sans-serif" font-size="19" font-weight="400">Exact time + group size → room, floor, time and reasons.</text><rect x="641" y="184" width="579" height="324" rx="8" fill="#FFFEFA" stroke="#D5DCCB"/><text x="667" y="218.66" fill="#A65D3D" font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="700">02 / AI WORKSPACE</text><text x="667" y="269.96" fill="#1A3029" font-family="Segoe UI, Arial, sans-serif" font-size="28" font-weight="700">Competing requests. Deeper models.</text><text x="668" y="342.84" fill="#626D5F" font-family="Segoe UI, Arial, sans-serif" font-size="12" font-weight="700">PLAN A BATCH</text><text x="797" y="345.76" fill="#1A3029" font-family="Segoe UI, Arial, sans-serif" font-size="18" font-weight="400">Coordinate up to ten requests.</text><text x="668" y="393.84" fill="#626D5F" font-family="Segoe UI, Arial, sans-serif" font-size="12" font-weight="700">COMPARE</text><text x="797" y="396.76" fill="#1A3029" font-family="Segoe UI, Arial, sans-serif" font-size="18" font-weight="400">First fit, hill climbing and small exact search.</text><text x="668" y="444.84" fill="#626D5F" font-family="Segoe UI, Arial, sans-serif" font-size="12" font-weight="700">EXPERIMENT</text><text x="797" y="447.76" fill="#1A3029" font-family="Segoe UI, Arial, sans-serif" font-size="18" font-weight="400">Routes, reports, forecasts and decision advice.</text><rect x="60" y="538" width="1160" height="73" rx="6" fill="#DFE6D2" stroke="none"/><text x="85" y="572.86" fill="#1A3029" font-family="Segoe UI, Arial, sans-serif" font-size="23" font-weight="700">Same engine. Same simulation calendar.</text><text x="85" y="598.30" fill="#626D5F" font-family="Segoe UI, Arial, sans-serif" font-size="15" font-weight="400">Local: SQLite on one computer. Hosted: one browser profile on the same origin.</text><line x1="60" y1="668" x2="1220" y2="668" stroke="#D5DCCB" stroke-width="1"/><text x="60" y="695.02" fill="#626D5F" font-family="Segoe UI, Arial, sans-serif" font-size="11" font-weight="700">EXPO SMART SCHEDULER / AI FUNDAMENTALS</text><text x="1162" y="695.66" fill="#626D5F" font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="400">02 / 07</text><text x="60" y="641.84" fill="#626D5F" font-family="Segoe UI, Arial, sans-serif" font-size="12" font-weight="400">Public reservations are not shared with other users and do not reserve university facilities.</text></svg></section><section class="slide" id="slide-3" aria-label="Slide 3: Six methods. A specific job for each."><svg viewBox="0 0 1280 720" role="img" aria-labelledby="title-3"><title id="title-3">Six methods. A specific job for each.</title><rect x="0" y="0" width="1280" height="720" rx="0" fill="#F5F4EE" stroke="none"/><text x="60" y="46.66" fill="#626D5F" font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="700">02 / SIX AIF METHODS</text><text x="60" y="110.26" fill="#1A3029" font-family="Segoe UI, Arial, sans-serif" font-size="43" font-weight="700">Six methods. A specific job for each.</text><rect x="60" y="177" width="374" height="197" rx="6" fill="#FFFEFA" stroke="#D5DCCB"/><text x="80" y="203.84" fill="#626D5F" font-family="Segoe UI, Arial, sans-serif" font-size="12" font-weight="700">01 / CSP</text><text x="80" y="243.86" fill="#1A3029" font-family="Segoe UI, Arial, sans-serif" font-size="23" font-weight="700">Constraint satisfaction</text><text x="80" y="274.76" fill="#626D5F" font-family="Segoe UI, Arial, sans-serif" font-size="18" font-weight="400">Check time, capacity, equipment, access</text><text x="80" y="299.76" fill="#626D5F" font-family="Segoe UI, Arial, sans-serif" font-size="18" font-weight="400">and room–computer conflicts.</text><rect x="80" y="337" width="78.677734375" height="28" rx="4" fill="#DFE6D2" stroke="none"/><text x="91" y="353.84" fill="#173C32" font-family="Segoe UI, Arial, sans-serif" font-size="12" font-weight="700">Feasibility</text><rect x="453" y="177" width="374" height="197" rx="6" fill="#FFFEFA" stroke="#D5DCCB"/><text x="473" y="203.84" fill="#626D5F" font-family="Segoe UI, Arial, sans-serif" font-size="12" font-weight="700">02 / LOCAL SEARCH</text><text x="473" y="243.86" fill="#1A3029" font-family="Segoe UI, Arial, sans-serif" font-size="23" font-weight="700">Hill climbing</text><text x="473" y="274.76" fill="#626D5F" font-family="Segoe UI, Arial, sans-serif" font-size="18" font-weight="400">Five seeded starts; accept improving</text><text x="473" y="299.76" fill="#626D5F" font-family="Segoe UI, Arial, sans-serif" font-size="18" font-weight="400">single or pair moves.</text><rect x="473" y="337" width="68.359375" height="28" rx="4" fill="#DFE6D2" stroke="none"/><text x="484" y="353.84" fill="#173C32" font-family="Segoe UI, Arial, sans-serif" font-size="12" font-weight="700">Ranking</text><rect x="846" y="177" width="374" height="197" rx="6" fill="#FFFEFA" stroke="#D5DCCB"/><text x="866" y="203.84" fill="#626D5F" font-family="Segoe UI, Arial, sans-serif" font-size="12" font-weight="700">03 / A*</text><text x="866" y="243.86" fill="#1A3029" font-family="Segoe UI, Arial, sans-serif" font-size="23" font-weight="700">A* graph search</text><text x="866" y="274.76" fill="#626D5F" font-family="Segoe UI, Arial, sans-serif" font-size="18" font-weight="400">Find a low-cost route in an example floor</text><text x="866" y="299.76" fill="#626D5F" font-family="Segoe UI, Arial, sans-serif" font-size="18" font-weight="400">graph. Step-free paths avoid stairs.</text><rect x="866" y="337" width="133.369140625" height="28" rx="4" fill="#DFE6D2" stroke="none"/><text x="877" y="353.84" fill="#173C32" font-family="Segoe UI, Arial, sans-serif" font-size="12" font-weight="700">Assumed route cost</text><rect x="60" y="392" width="374" height="197" rx="6" fill="#FFFEFA" stroke="#D5DCCB"/><text x="80" y="418.84" fill="#626D5F" font-family="Segoe UI, Arial, sans-serif" font-size="12" font-weight="700">04 / BAYES</text><text x="80" y="458.86" fill="#1A3029" font-family="Segoe UI, Arial, sans-serif" font-size="23" font-weight="700">Bayesian inference</text><text x="80" y="489.76" fill="#626D5F" font-family="Segoe UI, Arial, sans-serif" font-size="18" font-weight="400">One noisy report updates P(free). With no</text><text x="80" y="514.76" fill="#626D5F" font-family="Segoe UI, Arial, sans-serif" font-size="18" font-weight="400">report, keep the prior.</text><rect x="80" y="552" width="143.283203125" height="28" rx="4" fill="#DFE6D2" stroke="none"/><text x="91" y="568.84" fill="#173C32" font-family="Segoe UI, Arial, sans-serif" font-size="12" font-weight="700">Prior in simple search</text><rect x="453" y="392" width="374" height="197" rx="6" fill="#EBEDE2" stroke="#D5DCCB"/><text x="473" y="418.84" fill="#A65D3D" font-family="Segoe UI, Arial, sans-serif" font-size="12" font-weight="700">05 / HMM</text><text x="473" y="458.86" fill="#1A3029" font-family="Segoe UI, Arial, sans-serif" font-size="23" font-weight="700">Hidden Markov model</text><text x="473" y="489.76" fill="#626D5F" font-family="Segoe UI, Arial, sans-serif" font-size="18" font-weight="400">Filter a sequence of noisy reports, then</text><text x="473" y="514.76" fill="#626D5F" font-family="Segoe UI, Arial, sans-serif" font-size="18" font-weight="400">predict the next occupancy slot.</text><rect x="473" y="552" width="145.36328125" height="28" rx="4" fill="#EFE1D2" stroke="none"/><text x="484" y="568.84" fill="#173C32" font-family="Segoe UI, Arial, sans-serif" font-size="12" font-weight="700">Workspace sequences</text><rect x="846" y="392" width="374" height="197" rx="6" fill="#EBEDE2" stroke="#D5DCCB"/><text x="866" y="418.84" fill="#A65D3D" font-family="Segoe UI, Arial, sans-serif" font-size="12" font-weight="700">06 / BELIEF-STATE POMDP</text><text x="866" y="458.86" fill="#1A3029" font-family="Segoe UI, Arial, sans-serif" font-size="23" font-weight="700">Sequential decisions</text><text x="866" y="489.76" fill="#626D5F" font-family="Segoe UI, Arial, sans-serif" font-size="18" font-weight="400">Book, inspect, wait or leave using</text><text x="866" y="514.76" fill="#626D5F" font-family="Segoe UI, Arial, sans-serif" font-size="18" font-weight="400">finite-horizon backward recursion.</text><rect x="866" y="552" width="146.072265625" height="28" rx="4" fill="#EFE1D2" stroke="none"/><text x="877" y="568.84" fill="#173C32" font-family="Segoe UI, Arial, sans-serif" font-size="12" font-weight="700">Separate result advice</text><line x1="60" y1="668" x2="1220" y2="668" stroke="#D5DCCB" stroke-width="1"/><text x="60" y="695.02" fill="#626D5F" font-family="Segoe UI, Arial, sans-serif" font-size="11" font-weight="700">EXPO SMART SCHEDULER / AI FUNDAMENTALS</text><text x="1162" y="695.66" fill="#626D5F" font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="400">03 / 07</text><text x="60" y="641.84" fill="#626D5F" font-family="Segoe UI, Arial, sans-serif" font-size="12" font-weight="400">No report: retain the prior. No sequence: HMM is inactive. The POMDP advisor is separate from ranking; it uses backward recursion, not value iteration.</text></svg></section><section class="slide" id="slide-4" aria-label="Slide 4: Do not spend the only specialist space on a flexible request."><svg viewBox="0 0 1280 720" role="img" aria-labelledby="title-4"><title id="title-4">Do not spend the only specialist space on a flexible request.</title><rect x="0" y="0" width="1280" height="720" rx="0" fill="#F5F4EE" stroke="none"/><text x="60" y="46.66" fill="#626D5F"
